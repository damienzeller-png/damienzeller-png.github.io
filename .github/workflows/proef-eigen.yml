name: Proefsite eigen berichten
# Maakt direct na publiceren in de beheeromgeving (de Worker start deze taak) en daarnaast elk half uur een echte pagina voor wat de redactie in de beheeromgeving plaatste (s/w<nummer>/),
# zodat een gedeelde link in WhatsApp, Facebook of LinkedIn titel, tekst en foto toont in plaats van "Niet gevonden".
# Haalt niets van hartvoordenhaag.nl op; dat doet "Proefsite partij bijwerken" elke ochtend.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      verwacht:
        description: "Gestart door de beheeromgeving na publiceren: w<nummer>:publiceer of w<nummer>:weg"
        required: false
        default: ""
permissions:
  contents: write
concurrency: proef-inhoud
jobs:
  bouwen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pagina's maken
        env:
          VERWACHT: ${{ inputs.verwacht }}
        run: python proef/tools/bouw.py
      - name: Opslaan
        run: |
          git config user.name "data-robot"
          git config user.email "actions@users.noreply.github.com"
          git add -A proef 404.html
          git diff --cached --quiet && exit 0
          git commit -qm "Proefsite: eigen berichten $(date +%F' '%H:%M)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep $((RANDOM % 10 + 3)); done
          exit 1
