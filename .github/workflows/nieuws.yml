name: Nieuws bijwerken
# Elke ochtend en middag: nieuwe berichten van hartvoordenhaag.nl met Damiën Zeller in nieuws.json (tools/nieuws.py).
on:
  schedule:
    - cron: "10 5,12 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: nieuws
  cancel-in-progress: false
jobs:
  nieuws:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/nieuws.py
      - name: Opslaan
        run: |
          git config user.name "nieuws-robot"
          git config user.email "actions@users.noreply.github.com"
          git add nieuws.json
          git diff --cached --quiet && exit 0
          git commit -qm "Nieuws bijgewerkt $(date +%F)"
          git push -q
