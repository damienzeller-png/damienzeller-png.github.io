<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Redactie | Hart voor Den Haag (proef)</title>
<meta name="theme-color" content="#137345">
<meta name="color-scheme" content="light only">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="beeld/favicon.png">
<link rel="stylesheet" href="app.css?v=22">
<style>
/* Beheeromgeving. De huisstijl komt uit app.css; hier alleen wat de redactie extra nodig heeft. */
.beheer{padding-block:32px 80px}
.beheer-kop{font-size:clamp(2.2rem,5.5vw,3.4rem);font-weight:900;line-height:.98;margin:4px 0 10px}
.beheer-kop:focus{outline:none}
.beheer .inleiding{max-width:46em;color:var(--zacht)}
.inlog{max-width:480px;margin:0 auto}
.inlog .formulier+.formulier{margin-top:22px}
.nood{margin-top:22px}.nood summary{cursor:pointer;color:var(--zacht);min-height:44px;display:flex;align-items:center}
.nood .formulier{margin-top:8px}
.tabbalk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--lijn)}
.tabbalk .wie{margin-left:auto;color:var(--zacht);font-size:.92rem;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.kop-rij{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}
.kop-rij .knoppen{display:flex;flex-wrap:wrap;gap:10px}
.knoppen{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.link-knop{background:none;border:0;padding:0;font:inherit;color:var(--link);text-decoration:underline;cursor:pointer;min-height:44px}
.sub{font-size:1.6rem;margin:34px 0 10px}
.zacht{color:var(--zacht)}
.melding.waarschuwing{background:#FFF4CC;margin:16px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* overzicht */
.tegels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin-top:22px}
.tegel{display:grid;gap:4px;text-align:left;padding:18px;border-radius:18px;border:1.5px solid var(--lijn);background:var(--vlak);color:var(--ink);font:inherit;cursor:pointer;align-content:start;min-height:120px}
.tegel:hover{border-color:var(--veld);background:var(--munt)}
.tegel b{font:900 2.2rem/1 var(--kop);color:var(--link)}
.tegel span{font-weight:800;font-size:1.08rem}
.tegel small{color:var(--zacht)}
.logboek{list-style:none;margin:0;padding:0}
.logboek li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--lijn);font-size:.95rem}
.logboek time{color:var(--zacht);font-variant-numeric:tabular-nums}
@media (max-width:640px){.logboek li{grid-template-columns:1fr;gap:2px}}
/* berichtenlijst */
.filterbalk{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:12px;margin:6px 0 12px}
@media (max-width:860px){.filterbalk{grid-template-columns:1fr 1fr}.filterbalk .veld:first-child{grid-column:1/-1}}
.b-lijst{list-style:none;margin:0;padding:0}
.rij{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1.5px solid var(--lijn)}
.rij h3{font-size:1.15rem;line-height:1.25;margin-bottom:4px}
.rij .acties{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.b-rij .bijschrift{font-size:.88rem}
.concept h3{color:var(--zacht)}.concept{border-left:3px dashed var(--veldrand);padding-left:12px}
.concept-label{color:#8A5A00!important}
.foto-voorbeeld{max-width:280px;border-radius:12px;display:block;margin-bottom:8px}
.verborgen-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.postvak .rij{grid-template-columns:minmax(0,1fr) auto}
.postvak dl,.rollen{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0 0;font-size:.94rem}
.postvak dt,.rollen dt{color:var(--zacht);font-weight:700}.postvak dd,.rollen dd{margin:0;overflow-wrap:anywhere}
.rollen{max-width:46em;margin-top:14px}
@media (max-width:640px){.rij{grid-template-columns:minmax(0,1fr)}.rij .acties{justify-content:flex-start}}
/* bewerken */
.label{font-weight:700}
.vinkjes{display:flex;flex-wrap:wrap;gap:8px}
.vink-klein{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px;border:1.5px solid var(--veldrand);border-radius:999px;cursor:pointer;font-weight:600}
.vink-klein input{width:18px;height:18px;margin:0;accent-color:var(--veld)}
.vink-klein:has(input:checked){background:var(--munt);border-color:var(--veld)}
.vink-klein:has(input:focus-visible){outline:3px solid var(--zon);outline-offset:2px}
.re{border:1.5px solid var(--veldrand);border-radius:14px;background:var(--bg);overflow:hidden}
.re-balk{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-bottom:1px solid var(--lijn);background:var(--band);position:sticky;top:0;z-index:2}
.re-balk .knopje{min-height:38px;padding:6px 12px;font-size:.88rem;background:var(--bg)}
.re-tekst{min-height:280px;max-height:70vh;overflow:auto;padding:16px 18px;outline:none;max-width:none}
.re-tekst:focus{box-shadow:inset 0 0 0 3px var(--zon)}
.re-tekst img{max-width:100%;height:auto;border-radius:8px}
.hulp{max-width:46em}.hulp h2{font-size:1.5rem;margin-top:26px}
/* vensters: voorbeeld, link, opnieuw inloggen */
dialog{border:0;border-radius:20px;padding:0;max-width:min(560px,calc(100vw - 24px));width:100%;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);color:var(--ink);background:var(--bg)}
dialog::backdrop{background:rgba(7,42,26,.55)}
dialog .formulier{margin:0}
.voorbeeld-venster{max-width:min(1100px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto}
.voorbeeld-balk{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--zon);color:#10251A}
.voorbeeld-balk .zacht{color:#10251A;margin-right:auto}
.herhaal-rij{display:flex;flex-wrap:wrap;gap:8px}.herhaal-rij select{flex:1 1 220px}.herhaal-rij input{flex:0 1 200px}
.postvak .foto-mini{max-width:160px;max-height:160px;border-radius:10px;display:block;margin-top:8px;cursor:zoom-in}
.balken{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.balken li{display:grid;grid-template-columns:110px minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:.92rem}
.balken .b{height:14px;border-radius:7px;background:var(--hart);min-width:2px}
.balken .n{text-align:right;font-variant-numeric:tabular-nums}
.top-paden li{grid-template-columns:minmax(0,1fr) 70px}
.top-paden span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code-blok{font:600 1.15rem/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;padding:12px 14px;background:var(--band);border-radius:12px;word-break:break-all}
@media (max-width:640px){.tabbalk{gap:6px}.tabbalk .knopje{min-height:40px;padding:6px 12px;font-size:.9rem}.tabbalk .wie{margin-left:0;width:100%;justify-content:space-between}.datumregel p{font-size:.85rem}}
/* ontwerpronde 10 nov 2026: het werk eerder in beeld. De strook Redactie is een regel, de tabbladen een rij die opzij schuift */
.beheer{padding-block:16px 80px}
.datumregel{padding-block:0}
.datumregel .wrap{min-height:36px}
.tabbalk{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:16px;padding-bottom:10px}
.tabbalk .knopje{flex:none;min-height:44px}
.tabbalk .wie{flex:none;flex-wrap:nowrap;white-space:nowrap;width:auto;margin-left:auto}
@media (max-width:760px){.datumregel{display:none}.tabbalk{margin-inline:-16px;padding-inline:16px}}

/* 15 november 2026: makkelijker voor een medewerker. Start met taken, minder tabbladen, editor in stappen. */
.tabbalk{overflow:visible;flex-wrap:wrap}
.bol{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--zon);color:#10251A;font-size:.78rem;font-weight:800;margin-left:4px}
.wie-menu{position:relative;margin-left:auto}
.wie-menu summary{list-style:none;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:1.5px solid var(--veldrand);border-radius:999px}
.wie-menu summary::-webkit-details-marker{display:none}
.wie-menu summary::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px)}
.wie-menu[open] summary{background:var(--munt);border-color:var(--veld)}
.wie-lijst{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:220px;display:grid;gap:0;padding:10px 16px;background:var(--bg);border:1.5px solid var(--lijn);border-radius:12px;box-shadow:var(--schaduw)}
.wie-lijst p{color:var(--zacht);font-size:.86rem;padding-bottom:6px;border-bottom:1px solid var(--lijn);margin-bottom:4px}
.wie-lijst .link-knop{text-align:left;text-decoration:none;font-weight:600;color:var(--ink)}
.wie-lijst .link-knop:hover,.wie-lijst .link-knop[aria-pressed="true"]{color:var(--link);text-decoration:underline}
.ik{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.taak-tegels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
.taak-tegel{display:flex;gap:14px;align-items:center;text-align:left;min-height:84px;padding:16px 18px;border:1.5px solid var(--lijn);border-radius:14px;background:var(--vlak);color:var(--ink);font:inherit;cursor:pointer}
.taak-tegel .ik{color:var(--link)}
.taak-tegel span{display:grid;gap:2px}.taak-tegel b{font-size:1.08rem}.taak-tegel small{color:var(--zacht);font-size:.9rem}
.taak-tegel:hover{border-color:var(--veld);background:var(--munt)}
.taak-tegel:first-child{background:var(--zon);border-color:var(--zon);color:#10251A}.taak-tegel:first-child .ik,.taak-tegel:first-child small{color:#10251A}
.taak-tegel:first-child:hover{filter:brightness(.96)}
.te-doen-lijst{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-width:46em}
.te-doen{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;width:100%;text-align:left;min-height:60px;padding:10px 14px;border:1.5px solid var(--lijn);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.te-doen:hover{border-color:var(--veld);background:var(--munt)}
.te-doen>b{font:900 1.5rem/1 var(--kop);color:var(--link);text-align:center}
.te-doen span{display:grid;gap:1px;font-weight:700}.te-doen small{font-weight:400;color:var(--zacht);font-size:.88rem}
.snel{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
@media (max-width:860px){.taak-tegels{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.taak-tegels{grid-template-columns:1fr}.taak-tegel{min-height:68px}}
/* editor */
.ed{margin-top:16px}
.ed-raster{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start}
.ed-soort{max-width:340px;margin-bottom:6px}
.ed-stap{padding:20px 0 4px;border-top:1.5px solid var(--lijn);margin-top:16px}
.ed-stap h2{display:flex;align-items:center;gap:10px;font-size:1.35rem;margin-bottom:14px}
.ed-nr{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--veld);color:#fff;font:800 1rem/1 var(--tekst)}
.ed-meer{margin-top:18px;border-top:1.5px solid var(--lijn);padding-top:6px}
.ed-meer summary{cursor:pointer;min-height:48px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem}
.ed-meer summary small{font-weight:400;color:var(--zacht)}
.ed-meer[open] summary{margin-bottom:8px}
.ed-zij{position:sticky;top:16px;display:grid;gap:10px;padding:18px;border:1.5px solid var(--lijn);border-radius:14px;background:var(--band)}
.ed-zij h2{font-size:1.05rem;margin-top:6px}.ed-zij h2:first-child{margin-top:0}
.ed-check{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.95rem}
.ed-check li{display:grid;grid-template-columns:22px 1fr;align-items:center}
.ed-check .ok{color:var(--link);font-weight:700}.ed-check .mist{color:var(--zacht)}.ed-check .info{color:var(--ink)}.ed-check .info span{color:var(--zon)}
.deelkaart{border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--lijn)}
.dk-beeld{aspect-ratio:1.91/1;background:var(--munt);display:grid;place-items:center;color:var(--zacht);font-size:.86rem}
.dk-beeld img{width:100%;height:100%;object-fit:cover;display:block}
.dk-tekst{display:grid;gap:2px;padding:10px 12px}
.dk-tekst b{font-size:.95rem;line-height:1.25}.dk-tekst span{font-size:.84rem;color:var(--zacht);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.dk-tekst small{font-size:.76rem;color:var(--zacht)}
.ed-balk{position:sticky;bottom:0;z-index:6;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-top:22px;padding:12px 0;background:var(--bg);border-top:1.5px solid var(--lijn)}
.ed-klein{gap:18px}
@media (max-width:980px){.ed-raster{grid-template-columns:1fr}.ed-zij{position:static}}
.re-extra{display:contents}.re-extra[hidden]{display:none}.re-balk .re-meer{background:transparent;border-style:dashed}
/* na publiceren */
.klaar{max-width:40em}
.klaar-vink{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--veld);color:#fff;font-size:1.8rem;font-weight:800;margin-bottom:8px}
.klaar-link{display:grid;gap:6px;margin-top:18px;padding:16px;border:1.5px solid var(--lijn);border-radius:14px;background:var(--band)}
.klaar-link label{font-weight:700}.klaar-link .nb-rij{display:flex;gap:8px;flex-wrap:wrap}.klaar-link input{flex:1;min-width:200px;min-height:48px;padding:8px 12px;border:1.5px solid var(--veldrand);border-radius:10px;font:inherit;background:#fff}
.klaar-link small{color:var(--zacht)}
</style>
</head>
<body>
<header class="balk"><div class="wrap"><a class="merk" href="./" aria-label="Naar de proefsite"><img class="logo-licht" src="beeld/logo.svg" alt="Hart voor Den Haag" width="155" height="36"><img class="logo-donker" src="beeld/logo-wit.svg" alt="Hart voor Den Haag" width="155" height="36"></a><a class="knop lijn klein" href="./" target="_blank" rel="noopener">Naar de site<span class="verborgen"> (opent in een nieuw tabblad)</span> ↗</a></div></header>
<section class="datumregel" aria-label="Over deze omgeving"><div class="wrap"><p><b>Redactie</b> · Beheeromgeving van de proefsite. Wat u publiceert, staat binnen een minuut op de site.</p></div></section>
<main class="beheer"><div class="wrap" id="app"></div></main>
<script src="beheer.js?v=11"></script>
</body>
</html>
